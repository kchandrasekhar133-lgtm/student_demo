trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: 'student-flask-project'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  containerRegistry: 'myContainerRegistry'  # replace with your Azure Container Registry service connection name
  sonarServiceConnection: 'sonarqube-service-connection'  # replace with your Azure DevOps service connection name
  sonarProjectKey: 'student-flask-project'
  sonarProjectName: 'student-flask-project'

steps:
- task: UsePythonVersion@0
  displayName: Use Python 3.11
  inputs:
    versionSpec: '3.11'

- script: |
    python -m pip install --upgrade pip
    python -m pip install Flask==2.2.5 pytest pytest-cov
  displayName: Install Python dependencies

- task: SonarQubePrepare@5
  displayName: Prepare SonarQube analysis
  inputs:
    SonarQube: '$(student_key)'  # Azure DevOps service connection to your SonarQube server
    scannerMode: 'CLI'
    configMode: 'file'
    cliProjectKey: '$(kchandrasekhar)'
    cliProjectName: '$(kchandrasekhar)'
    configFile: '$(Build.SourcesDirectory)/sonar-project.properties'

- script: |
    pytest --maxfail=1 --disable-warnings --junitxml=test-results.xml
  displayName: Run unit tests
  continueOnError: true

- task: SonarQubeAnalyze@5
  displayName: Run SonarQube analysis

- task: SonarQubePublish@5
  displayName: Publish SonarQube results

- task: Docker@2
  displayName: Build and push container image
  inputs:
    command: buildAndPush
    containerRegistry: $(containerRegistry)
    repository: $(imageRepository)
    dockerfile: $(dockerfilePath)
    tags: |
      $(tag)
      latest
